<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>GenX</title>
    <link rel="preconnect" href="https://bridge.playgama.com">
    <link rel="preload" href="Build/WebGL.wasm" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="Build/WebGL.data" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="Build/WebGL.framework.js" as="script">
    <style>
        :root {
            --max-aspect-ratio: 0.6;
        }

        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background: #181818;
        }

        #viewport-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #BBA669; /*url('bg.jpg') center / cover no-repeat;*/
            /*filter: blur(20px) brightness(0.6);*/
            transform: scale(1.1);
            z-index: 0;
            pointer-events: none;
        }

        #game-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * var(--max-aspect-ratio));
            max-width: calc(100dvh * var(--max-aspect-ratio));
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.75);
            overflow: hidden;
        }

        .fullscreen-canvas {
            background: #242424;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #242424;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-8vh);
        }
        .loader-logo {
            width: 220px;
            height: auto;
            margin-bottom: 25px;
            display: block;
        }
        .loader-slider-container {
            width: 270px;
            height: 8px;
            background-color: #3e3e3e;
            border-radius: 4px;
            overflow: hidden;
        }
        .loader-slider-bar {
            width: 0%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 4px;
            transition: width 0.15s ease-out;
        }
    </style>
</head>
<body>
<!-- Экран загрузки -->
<div id="loader-overlay">
    <div class="loader-content">
        <img src="logo.png" class="loader-logo" alt="Game Logo">
        <div class="loader-slider-container">
            <div id="loader-slider-bar" class="loader-slider-bar"></div>
        </div>
    </div>
</div>

<div id="viewport-container">
    <div id="bg-blur"></div>
    <div id="game-wrapper">
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
    </div>
</div>

<script src="./playgama-bridge-unity.js"></script>

<script>
    if (typeof onUnityLoadingProgressChanged === 'function') {
        const originalProgressCallback = onUnityLoadingProgressChanged;

        onUnityLoadingProgressChanged = function(progress) {
            originalProgressCallback(progress);

            const progressBar = document.getElementById('loader-slider-bar');
            const overlay = document.getElementById('loader-overlay');

            let percent = progress * 100;
            if (percent > 100) percent = 100;

            if (progressBar) {
                progressBar.style.width = percent + '%';
            }

            if (progress >= 1) {
                setTimeout(() => {
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                        }, 500);
                    }
                }, 150);
            }
        };
    }
</script>
</body>
</html>
